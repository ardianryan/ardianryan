services:
  portfolio:
    image: ghcr.io/ardianryan/ardianryan:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ardianryan-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
