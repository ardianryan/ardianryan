name: Update Profile Telemetry Assets

on:
  schedule:
    - cron: "0 1 * * *" # Runs daily at 01:00 UTC (08:00 WIB)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate clean profile SVGs
        run: node scripts/generate-profile-assets.mjs

      - name: Commit & push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-assets/
          if git diff --staged --quiet; then
            echo "No changes detected in profile telemetry assets."
          else
            git commit -m "chore(profile): refresh telemetry & stats assets [skip ci]"
            git push
          fi
